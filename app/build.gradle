// Wire trojan native build into every build variant.
// mergeJniLibFolders is the task that actually consumes app/libs/<abi>/*.so,
// so it must depend on verifyTrojanNative which in turn depends on buildTrojanNative.
android.applicationVariants.all { variant ->
    def variantName = variant.name.capitalize()
    tasks.matching { it.name == "merge${variantName}JniLibFolders" }.configureEach {
        dependsOn 'verifyTrojanNative'
    }
}

