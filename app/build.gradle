apply plugin: 'com.android.application'
apply plugin: 'jacoco'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'kotlin-kapt'

// ---------------------------------------------------------------------------
// trojan-rs native library — auto-build when remote HEAD changes
// ---------------------------------------------------------------------------
def trojanScript = file("${rootProject.projectDir}/scripts/setup-trojan.sh")

tasks.register('buildTrojanNative') {
    description = 'Clone/pull trojan-rs and build libtrojan.so if the remote has changed'
    outputs.dir(file("${rootProject.projectDir}/app/libs"))
    doLast {
        exec {
            executable trojanScript
            args rootProject.projectDir
        }
    }
}

// Verify .so files exist after the task runs; fail fast if build produced nothing
tasks.register('verifyTrojanNative') {
    description = 'Verify libtrojan.so exists for all ABIs'
    dependsOn 'buildTrojanNative'
    doLast {
        def abis = ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86']
        def libsDir = file("${rootProject.projectDir}/app/libs")
        for (abi in abis) {
            def so = new File(libsDir, "${abi}/libtrojan.so")
            if (!so.exists()) {
                throw new GradleException(
                    "libtrojan.so not found for ${abi}. " +
                    "Run: ./scripts/setup-trojan.sh")
            }
        }
    }
}

android {
    compileSdkVersion 36
    signingConfigs {
        release {
            storeFile file('/tmp/keys/android.jks')
            storePassword 'Free-Web-Movement@2023'
            keyAlias 'key0'
            keyPassword 'Free-Web-Movement@2023'
        }
    }
    defaultConfig {
        applicationId "io.github.freewebmovement.igniter"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 2
        versionName "0.1.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            debugSymbolLevel 'FULL'
        }

        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk.debugSymbolLevel 'FULL'
        }
        debug {
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
            debuggable true
        }
    }
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            exceptionFormat "full"
            events "started", "skipped", "passed", "failed"
            showStandardStreams true
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
    namespace 'io.github.freewebmovement.igniter'
    buildFeatures {
        aidl true
        viewBinding true
        compose true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

